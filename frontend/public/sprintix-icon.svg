      <rect x="223" y="220" width="73" height="72" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="3"/>
      <rect x="234" y="232" width="42" height="6" rx="3" fill="#4338CA"/>
      <rect x="234" y="247" width="49" height="5" rx="2.5" fill="#A5B4FC"/>
      <rect x="234" y="266" width="50" height="8" rx="4" fill="#C7D2FE"/>
