services:

  # ==========================================================
  # FastAPI Backend
  # ==========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: pms_backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    depends_on:
      - redis

    restart: unless-stopped

  # ==========================================================
  # Redis
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: redis_container

    ports:
      - "6379:6379"

    command:
      - redis-server
      - --appendonly
      - "yes"
    
    volumes:
      - redis_data:/data
    
    restart: unless-stopped


# ==========================================================
# Named Volumes
# ==========================================================
volumes:
  redis_data: